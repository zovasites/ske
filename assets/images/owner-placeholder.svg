<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="100%" height="100%">
  <defs>
    <linearGradient id="ownerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
  </defs>
  <rect width="320" height="360" rx="16" fill="url(#ownerBg)" />
  <rect x="12" y="12" width="296" height="336" rx="12" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Professional Executive Silhouette / Badge -->
  <g transform="translate(110, 80)">
    <circle cx="50" cy="40" r="32" fill="url(#avatarGrad)" />
    <!-- Neck & Suit Collar -->
    <path d="M 15 110 C 15 80, 85 80, 85 110 Z" fill="url(#avatarGrad)" />
    <polygon points="50,82 42,105 58,105" fill="#FFFFFF" opacity="0.9" />
    <polygon points="50,90 46,105 54,105" fill="#D32F2F" />
  </g>

  <!-- Name & Label text -->
  <text x="160" y="240" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#0B2545" text-anchor="middle">
    B. Arun Prakash
  </text>
  <text x="160" y="262" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#D32F2F" text-anchor="middle">
    Proprietor / Business Contact
  </text>
  <text x="160" y="285" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">
    [Photo Placeholder • Replaceable]
  </text>
</svg>
